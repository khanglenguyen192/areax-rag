name: Debug Docker Hub credentials

# Temporary: checks the Docker Hub secrets without pushing anything and without printing them.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect secrets and the granted scope
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HUB_REPO: ${{ vars.DOCKERHUB_REPOSITORY || secrets.DOCKERHUB_REPOSITORY }}
        run: |
          has_ws() { case "$1" in *[[:space:]]*) echo yes;; *) echo no;; esac; }
          echo "username: length=${#HUB_USER} whitespace=$(has_ws "$HUB_USER") equals_expected=$([ "$HUB_USER" = "khanglenguyen192" ] && echo yes || echo no)"
          echo "repo:     length=${#HUB_REPO} whitespace=$(has_ws "$HUB_REPO") equals_expected=$([ "$HUB_REPO" = "areax-rag" ] && echo yes || echo no)"
          echo "token:    length=${#HUB_TOKEN} whitespace=$(has_ws "$HUB_TOKEN") starts_with_dckr_pat=$([ "${HUB_TOKEN#dckr_pat_}" != "$HUB_TOKEN" ] && echo yes || echo no)"
          echo "--- asking Docker Hub which actions this login may perform on the repository"
          code=$(curl -s -o resp.json -w '%{http_code}' -u "$HUB_USER:$HUB_TOKEN" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:khanglenguyen192/areax-rag:pull,push")
          echo "auth http status: $code"
          if [ "$code" = "200" ]; then
            python3 - <<'PY'
          import json, base64
          token = json.load(open("resp.json"))["token"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print("granted access:", json.dumps(claims.get("access")))
          PY
          else
            head -c 300 resp.json; echo
          fi
