name: Deploy application

# Runs only when someone pushes to the deployment branch. There is no quality gate in this phase
# (a decision recorded in areax-rag-requirement); `next build` still fails the run on type errors.
on:
  push:
    branches: [deployment/prod]
    paths:
      - "areax-rag-application/**"
      - ".github/workflows/application-deploy.yml"
  workflow_dispatch:

# One deploy at a time; a second push waits instead of cancelling a deploy that is mid-way.
concurrency:
  group: deploy-application
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image reference
        id: ref
        run: echo "image=${IMAGE}:application-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: areax-rag-application
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ env.IMAGE }}:application-latest
          cache-from: type=gha,scope=application
          cache-to: type=gha,scope=application,mode=max

  deploy:
    name: Deploy to the VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy deploy files
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p $PORT"
          $SSH "$USER_NAME@$HOST" 'mkdir -p ~/areax-rag/application'
          scp -i ~/.ssh/id_deploy -P "$PORT" \
            areax-rag-application/deploy/compose.yml \
            areax-rag-application/deploy/deploy.sh \
            "$USER_NAME@$HOST:~/areax-rag/application/"

      - name: Deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          IMAGE_REF: ${{ needs.build.outputs.image }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER_NAME@$HOST" \
            "bash ~/areax-rag/application/deploy.sh '$IMAGE_REF'"
