# Postgres for areax-rag (runs on the VPS).
# Start with: ../scripts/infra.sh up postgres   (needs compose/.env, see .env.example)
#
# - Published on 127.0.0.1 ONLY. Never publish 5432 on all interfaces: a Postgres with a default
#   password that was reachable from the internet was taken over on this VPS and used to mine
#   cryptocurrency. Reach this one through the SSH tunnel (scripts/tunnel.sh).
# - POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB are read from compose/.env. The image creates
#   that user (a superuser of this private cluster) and the database on the first start, when the
#   data volume is empty. Changing them later does not alter an existing volume.
# - The application owns the schema (Prisma migrations); this file only starts the server.

name: areax-rag-postgres

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in compose/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in compose/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in compose/.env}
    # Small settings for a 4GB VPS shared with Kafka and Floci.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: areax-rag-postgres-data
