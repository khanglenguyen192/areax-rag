# Kafka for areax-rag: single broker in KRaft mode (runs on the VPS).
# Start with: ../scripts/infra.sh up kafka     then create topics: ../scripts/init-kafka-topics.sh
#
# Two listeners, one broker:
#   INTERNAL  kafka:9092   for other containers on the VPS (not published)
#   EXTERNAL  :9094        advertised as localhost:9094, published on 127.0.0.1 only;
#                          your machine reaches it through the SSH tunnel.
# This works only because there is a single broker. Not yet tested through the tunnel.

name: areax-rag-kafka

services:
  kafka:
    image: apache/kafka:4.3.2
    container_name: areax-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_ADVERTISED:-localhost:9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created explicitly by scripts/init-kafka-topics.sh, so a typo in a topic
      # name fails loudly instead of silently creating a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Keep the JVM small on a 4GB VPS.
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms256m -Xmx512m}
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: ${KAFKA_MEM_LIMIT:-768m}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  kafka_data:
    name: areax-rag-kafka-data
